name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.0.0)'
        required: true
        default: '1.0.0'
        type: string
      create_release:
        description: 'Create GitHub Release'
        required: false
        default: true
        type: boolean
      prerelease:
        description: 'Mark as pre-release'
        required: false
        default: false
        type: boolean
      release_notes:
        description: 'Custom release notes (optional)'
        required: false
        type: string
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest] #, ubuntu-latest
        python-version: ['3.12']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests>=2.28.1 PyYAML>=6.0 pyinstaller>=5.0
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        shell: bash
      
      - name: Update spec file for current OS
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            sed -i 's/os_name = .*/os_name = "windows-latest"/g' ip_cidr_processor.spec
          else
            sed -i 's/os_name = .*/os_name = "ubuntu-latest"/g' ip_cidr_processor.spec
          fi
        shell: bash
      
      - name: Build executable
        run: |
          pyinstaller ip_cidr_processor.spec
        shell: bash
      
      - name: List build artifacts (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          echo "=== Contents of dist/ directory ==="
          Get-ChildItem dist/ -Recurse
        shell: pwsh
      
      - name: List build artifacts (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          echo "=== Contents of dist/ directory ==="
          ls -laR dist/
        shell: bash
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ip_cidr_processor-${{ matrix.os }}-${{ matrix.python-version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 90

  release:
    needs: build
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
            echo "Source: Manual workflow dispatch"
          else
            VERSION=${GITHUB_REF#refs/tags/v}
            echo "Source: Git tag"
          fi
          
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION}" >> $GITHUB_OUTPUT
          echo "📌 Version: ${VERSION}"
          echo "🏷️  Tag: v${VERSION}"
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      
      - name: Display downloaded artifacts
        run: |
          echo "=== Downloaded artifacts structure ==="
          ls -laR release-artifacts/
          echo ""
          echo "=== Artifact count ==="
          find release-artifacts -type f | wc -l
      
      - name: Prepare release assets
        id: prepare
        run: |
          mkdir -p release-files
          
          # Copy all files from artifacts to release-files
          find release-artifacts -type f -exec cp {} release-files/ \;
          
          # Create version info file
          cat > release-files/VERSION.txt << 'EOF'
          Version: ${{ steps.version.outputs.version }}
          Release Date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          Commit: ${{ github.sha }}
          Built by: GitHub Actions
          Workflow Run: ${{ github.run_id }}
          EOF
          
          echo "=== Files prepared for release ==="
          ls -lah release-files/
          
          # Count files
          FILE_COUNT=$(find release-files -type f | wc -l)
          echo "file_count=${FILE_COUNT}" >> $GITHUB_OUTPUT
          echo "📦 Total files: ${FILE_COUNT}"
      
      - name: Create or update tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          TAG="${{ steps.version.outputs.tag }}"
          
          # Delete tag if exists (locally and remotely)
          git tag -d "$TAG" 2>/dev/null || true
          git push origin ":refs/tags/$TAG" 2>/dev/null || true
          
          # Create new tag
          git tag -a "$TAG" -m "Release ${{ steps.version.outputs.version }}"
          git push origin "$TAG"
          
          echo "✅ Tag $TAG created and pushed"
      
      - name: Generate release notes
        id: release_notes
        run: |
          NOTES_FILE="release_notes.md"
          
          cat > "$NOTES_FILE" << 'NOTES_EOF'
          ## 🚀 IP CIDR Processor v${{ steps.version.outputs.version }}
          
          **Release Information:**
          - 📅 Built on: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          - 🔧 Commit: `${{ github.sha }}`
          - ⚡ Trigger: ${{ github.event_name }}
          - 👤 Released by: ${{ github.actor }}
          
          NOTES_EOF
          
          # Add custom release notes if provided
          if [ -n "${{ github.event.inputs.release_notes }}" ]; then
            echo "" >> "$NOTES_FILE"
            echo "### 📝 Release Notes" >> "$NOTES_FILE"
            echo "${{ github.event.inputs.release_notes }}" >> "$NOTES_FILE"
          fi
          
          # Add download instructions
          cat >> "$NOTES_FILE" << 'DOWNLOAD_EOF'
          
          ### 📥 Download
          
          Download the appropriate executable for your operating system from the assets below:
          
          - **Windows**: `ip_cidr_processor-windows-latest-*.exe` or similar
          - **Linux**: `ip_cidr_processor-ubuntu-latest-*` or similar
          
          ### 🔍 Files in this release
          
          DOWNLOAD_EOF
          
          # List files
          echo '```' >> "$NOTES_FILE"
          ls -lh release-files/ >> "$NOTES_FILE"
          echo '```' >> "$NOTES_FILE"
          
          echo "notes_file=$NOTES_FILE" >> $GITHUB_OUTPUT
          
          echo "=== Generated Release Notes ==="
          cat "$NOTES_FILE"
      
      - name: Check if release exists
        id: check_release
        continue-on-error: true
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ steps.version.outputs.tag }}")
          
          if [ "$RESPONSE" = "200" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "⚠️  Release already exists"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "✅ Release does not exist, will create new one"
          fi
      
      - name: Delete existing release if exists
        if: steps.check_release.outputs.exists == 'true'
        continue-on-error: true
        run: |
          RELEASE_ID=$(curl -s \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ steps.version.outputs.tag }}" \
            | jq -r '.id')
          
          if [ "$RELEASE_ID" != "null" ] && [ -n "$RELEASE_ID" ]; then
            curl -X DELETE \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID"
            echo "🗑️  Deleted existing release"
            sleep 2
          fi
      
      - name: Create GitHub Release
        id: create_release
        if: github.event.inputs.create_release != 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: IP CIDR Processor ${{ steps.version.outputs.tag }}
          body_path: ${{ steps.release_notes.outputs.notes_file }}
          draft: false
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          generate_release_notes: false
          files: |
            release-files/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Verify release creation
        run: |
          echo "════════════════════════════════════════"
          echo "✅ RELEASE CREATED SUCCESSFULLY!"
          echo "════════════════════════════════════════"
          echo ""
          echo "📋 Release Details:"
          echo "  • Version: ${{ steps.version.outputs.version }}"
          echo "  • Tag: ${{ steps.version.outputs.tag }}"
          echo "  • Files: ${{ steps.prepare.outputs.file_count }}"
          echo "  • Prerelease: ${{ github.event.inputs.prerelease }}"
          echo ""
          
          if [ -n "${{ steps.create_release.outputs.url }}" ]; then
            echo "🔗 Release URL:"
            echo "   ${{ steps.create_release.outputs.url }}"
          else
            echo "🔗 Release URL:"
            echo "   https://github.com/${{ github.repository }}/releases/tag/${{ steps.version.outputs.tag }}"
          fi
          
          echo ""
          echo "════════════════════════════════════════"
      
      - name: Summary
        if: always()
        run: |
          echo "### 🎉 Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Version | \`${{ steps.version.outputs.version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | \`${{ steps.version.outputs.tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Files | ${{ steps.prepare.outputs.file_count }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Prerelease | ${{ github.event.inputs.prerelease }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Status | ✅ Success |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[🔗 View Release](https://github.com/${{ github.repository }}/releases/tag/${{ steps.version.outputs.tag }})" >> $GITHUB_STEP_SUMMARY
